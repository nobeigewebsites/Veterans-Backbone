<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VB REF-6B Authenticated Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      margin-bottom: 6px;
    }

    .sub {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0 25px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1c1c1c;
    }

    th,
    td {
      border: 1px solid #444;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .PASS {
      font-weight: bold;
    }

    .FAIL {
      font-weight: bold;
    }

    .INFO {
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    #summary {
      margin-top: 20px;
      padding: 16px;
      background: #1c1c1c;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>REF-6B — Authenticated Browser Assault</h1>

  <div class="sub">
    DEV only. Read-only authenticated boundary test.
    No genuine case or referral records are changed.
  </div>

  <button id="runBtn" disabled>
    Loading test harness...
  </button>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Test</th>
        <th>Result</th>
        <th>Evidence</th>
      </tr>
    </thead>

    <tbody id="results"></tbody>
  </table>

  <div id="summary">
    Initialising...
  </div>


  <script type="module">

    // ========================================================
    // EXPECTED DEV IDENTITY
    // ========================================================

    const EXPECTED_AUTH_UID =
      "4f72cbe3-8b73-45c7-a2d7-2d5484bdfb5e";

    const EXPECTED_STAFF_ID =
      "692a00f9-5944-46b0-9efe-e4eccabc21e2";

    const EXPECTED_SITE_ID =
      "b7129ac5-924c-46fb-9e84-79274064f318";


    const results = [];

    let supabase;


    // ========================================================
    // DISPLAY HELPERS
    // ========================================================

    function add(
      number,
      test,
      result,
      evidence = ""
    ) {

      results.push({
        number,
        test,
        result,
        evidence
      });

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function render() {

      const tbody =
        document.getElementById("results");

      tbody.innerHTML =
        results.map(row => `
          <tr>
            <td>${row.number}</td>

            <td>
              ${escapeHtml(row.test)}
            </td>

            <td class="${escapeHtml(row.result)}">
              ${escapeHtml(row.result)}
            </td>

            <td>
              <pre>${escapeHtml(row.evidence)}</pre>
            </td>
          </tr>
        `).join("");


      const pass =
        results.filter(
          row => row.result === "PASS"
        ).length;

      const fail =
        results.filter(
          row => row.result === "FAIL"
        ).length;

      const info =
        results.filter(
          row => row.result === "INFO"
        ).length;


      document.getElementById(
        "summary"
      ).textContent =
        `PASS=${pass} | FAIL=${fail} | INFO=${info} | TOTAL=${results.length}`;

    }


    // ========================================================
    // LOAD ACTUAL SHARED VB SUPABASE CLIENT
    // ========================================================

    try {

      const module =
        await import(
          "./js/supabase-client.js"
        );

      supabase = module.supabase;


      if (!supabase) {

        throw new Error(
          "supabase-client.js loaded but did not export supabase."
        );

      }


      const button =
        document.getElementById("runBtn");

      button.disabled = false;
      button.textContent = "Run REF-6B";


      document.getElementById(
        "summary"
      ).textContent =
        "Harness loaded. Ready to test.";


    } catch (error) {

      add(
        0,
        "Load shared Supabase client",
        "FAIL",
        error.message
      );

      render();

    }


    // ========================================================
    // TEST RUNNER
    // ========================================================

    async function runTests() {

      results.length = 0;


      // ======================================================
      // 1 — SHARED CLIENT
      // ======================================================

      add(
        1,
        "Shared Supabase client loaded",
        supabase ? "PASS" : "FAIL",
        supabase
          ? "Imported from ./js/supabase-client.js"
          : "Shared client unavailable"
      );


      // ======================================================
      // 2 — AUTH SESSION
      // ======================================================

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabase.auth.getSession();


      if (sessionError) {

        add(
          2,
          "Authenticated session available",
          "FAIL",
          sessionError.message
        );

        render();

        return;

      }


      const session =
        sessionData?.session;

      const user =
        session?.user;


      add(
        2,
        "Authenticated session available",
        session ? "PASS" : "FAIL",
        session
          ? `Authenticated as ${user.email}`
          : "No active authenticated session"
      );


      if (!session) {

        render();

        return;

      }


      // ======================================================
      // 3 — EXPECTED AUTH UID
      // ======================================================

      add(
        3,
        "Correct DEV authentication identity",
        user.id === EXPECTED_AUTH_UID
          ? "PASS"
          : "FAIL",
        `auth.uid=${user.id}`
      );


      // ======================================================
      // 4 — CANONICAL STAFF RESOLUTION
      // ======================================================

      const {
        data: currentStaffId,
        error: currentStaffError
      } =
        await supabase.rpc(
          "current_staff_id"
        );


      add(
        4,
        "Authenticated identity resolves to VB staff",
        !currentStaffError &&
        currentStaffId === EXPECTED_STAFF_ID
          ? "PASS"
          : "FAIL",

        currentStaffError
          ? currentStaffError.message
          : `staff_id=${currentStaffId}`
      );


      // ======================================================
      // 5 — STAFF PROFILE
      //
      // ACTUAL VERIFIED TABLE:
      // public.staff_profiles
      // ======================================================

      const {
        data: staffRows,
        error: staffError
      } =
        await supabase
          .from("staff_profiles")
          .select(`
            id,
            auth_user_id,
            organisation_id,
            primary_site_id,
            primary_team_id,
            staff_code,
            display_name,
            employment_type,
            is_active
          `)
          .eq(
            "id",
            EXPECTED_STAFF_ID
          )
          .limit(1);


      const staff =
        !staffError &&
        staffRows?.length
          ? staffRows[0]
          : null;


      add(
        5,
        "Staff record visible through RLS",
        staffError
          ? "FAIL"
          : staff
            ? "PASS"
            : "FAIL",

        staffError
          ? staffError.message
          : staff
            ? `${staff.display_name} / ${staff.staff_code}`
            : "Expected staff profile not visible"
      );


      // ======================================================
      // 6 — STAFF ACTIVE
      //
      // ACTUAL VERIFIED COLUMN:
      // is_active
      // ======================================================

      if (staff) {

        add(
          6,
          "Staff identity active",
          staff.is_active === true
            ? "PASS"
            : "FAIL",
          `is_active=${staff.is_active}`
        );

      } else {

        add(
          6,
          "Staff identity active",
          "INFO",
          "Skipped because staff profile unavailable"
        );

      }


      // ======================================================
      // 7 — PRIMARY SITE
      //
      // ACTUAL VERIFIED COLUMN:
      // primary_site_id
      // ======================================================

      if (staff) {

        add(
          7,
          "Expected primary site scope",
          staff.primary_site_id ===
            EXPECTED_SITE_ID
            ? "PASS"
            : "FAIL",

          `primary_site_id=${staff.primary_site_id}`
        );

      } else {

        add(
          7,
          "Expected primary site scope",
          "INFO",
          "Skipped because staff profile unavailable"
        );

      }


      // ======================================================
      // 8 — CASE READ
      // ======================================================

      const {
        data: cases,
        error: caseError
      } =
        await supabase
          .from("cases")
          .select(`
            id,
            case_code,
            case_status,
            veteran_id,
            site_id,
            assigned_staff_id
          `)
          .limit(20);


      add(
        8,
        "Permitted cases readable",
        caseError
          ? "FAIL"
          : "PASS",

        caseError
          ? caseError.message
          : `visible_rows=${cases.length}`
      );


      // ======================================================
      // 9 — CASE SITE BOUNDARY
      // ======================================================

      if (!caseError) {

        const outsideCases =
          cases.filter(
            row =>
              row.site_id &&
              row.site_id !==
                EXPECTED_SITE_ID
          );


        add(
          9,
          "Visible cases remain within expected site",
          outsideCases.length === 0
            ? "PASS"
            : "FAIL",
          `out_of_scope_rows=${outsideCases.length}`
        );

      } else {

        add(
          9,
          "Visible cases remain within expected site",
          "INFO",
          "Case query unavailable"
        );

      }


      // ======================================================
      // 10 — REFERRAL READ
      // ======================================================

      const {
        data: referrals,
        error: referralError
      } =
        await supabase
          .from("referrals")
          .select("*")
          .limit(20);


      add(
        10,
        "Permitted referrals readable",
        referralError
          ? "FAIL"
          : "PASS",

        referralError
          ? referralError.message
          : `visible_rows=${referrals.length}`
      );


      // ======================================================
      // 11 — REFERRAL SITE BOUNDARY
      // ======================================================

      if (!referralError) {

        const outsideReferrals =
          referrals.filter(
            row =>
              row.site_id &&
              row.site_id !==
                EXPECTED_SITE_ID
          );


        add(
          11,
          "Visible referrals remain within expected site",
          outsideReferrals.length === 0
            ? "PASS"
            : "FAIL",

          `out_of_scope_rows=${outsideReferrals.length}`
        );

      } else {

        add(
          11,
          "Visible referrals remain within expected site",
          "INFO",
          "Referral query unavailable"
        );

      }


      // ======================================================
      // 12 — CASE OPERATIONAL EXCEPTIONS
      //
      // View is security_invoker=true.
      // Authenticated SELECT was verified/repaired.
      // ======================================================

      const {
        data: exceptions,
        error: exceptionError
      } =
        await supabase
          .from(
            "case_operational_exceptions"
          )
          .select("*")
          .limit(20);


      add(
        12,
        "Case exception view respects authenticated access",
        exceptionError
          ? "FAIL"
          : "PASS",

        exceptionError
          ? exceptionError.message
          : `visible_rows=${exceptions.length}`
      );


      // ======================================================
      // 13 — INTERNAL EVALUATOR
      //
      // Browser MUST NOT execute this.
      // ======================================================

      const {
        error: evaluatorError
      } =
        await supabase.rpc(
          "evaluate_case_controls"
        );


      add(
        13,
        "Internal case evaluator blocked from browser",
        evaluatorError
          ? "PASS"
          : "FAIL",

        evaluatorError
          ? evaluatorError.message
          : "Evaluator unexpectedly executed"
      );


      // ======================================================
      // 14 — CASE TIMELINE
      //
      // Authenticated SELECT exists.
      // Existing RLS requires CASE_VIEW.
      // ======================================================

      const {
        data: events,
        error: eventsError
      } =
        await supabase
          .from("case_events")
          .select("*")
          .limit(20);


      add(
        14,
        "Permitted case timeline readable",
        eventsError
          ? "FAIL"
          : "PASS",

        eventsError
          ? eventsError.message
          : `visible_rows=${events.length}`
      );


      // ======================================================
      // 15 — CASE ACTIONS
      // ======================================================

      const {
        data: actions,
        error: actionsError
      } =
        await supabase
          .from("case_actions")
          .select("*")
          .limit(20);


      add(
        15,
        "Permitted case actions readable",
        actionsError
          ? "FAIL"
          : "PASS",

        actionsError
          ? actionsError.message
          : `visible_rows=${actions.length}`
      );


      // ======================================================
      // 16 — CASE REVIEWS
      // ======================================================

      const {
        data: reviews,
        error: reviewsError
      } =
        await supabase
          .from("case_reviews")
          .select("*")
          .limit(20);


      add(
        16,
        "Permitted case reviews readable",
        reviewsError
          ? "FAIL"
          : "PASS",

        reviewsError
          ? reviewsError.message
          : `visible_rows=${reviews.length}`
      );


      // ======================================================
      // 17 — REFERRAL FOLLOW-UPS
      // ======================================================

      const {
        data: followUps,
        error: followUpError
      } =
        await supabase
          .from("referral_follow_ups")
          .select("*")
          .limit(20);


      add(
        17,
        "Permitted referral follow-ups readable",
        followUpError
          ? "FAIL"
          : "PASS",

        followUpError
          ? followUpError.message
          : `visible_rows=${followUps.length}`
      );


      // ======================================================
      // 18 — CASE DELETE ATTACK
      //
      // Impossible UUID.
      // No genuine case can be touched.
      // ======================================================

      const fakeCaseId =
        "00000000-0000-0000-0000-000000000001";


      const {
        data: deleteCaseData,
        error: deleteCaseError
      } =
        await supabase
          .from("cases")
          .delete()
          .eq(
            "id",
            fakeCaseId
          )
          .select("id");


      const caseDeleteBlocked =
        Boolean(deleteCaseError) ||
        (
          Array.isArray(deleteCaseData) &&
          deleteCaseData.length === 0
        );


      add(
        18,
        "Browser case DELETE boundary",
        caseDeleteBlocked
          ? "PASS"
          : "FAIL",

        deleteCaseError
          ? deleteCaseError.message
          : `affected_rows=${deleteCaseData?.length ?? 0}`
      );


      // ======================================================
      // 19 — REFERRAL DELETE ATTACK
      //
      // Impossible UUID.
      // No genuine referral can be touched.
      // ======================================================

      const fakeReferralId =
        "00000000-0000-0000-0000-000000000002";


      const {
        data: deleteReferralData,
        error: deleteReferralError
      } =
        await supabase
          .from("referrals")
          .delete()
          .eq(
            "id",
            fakeReferralId
          )
          .select("id");


      const referralDeleteBlocked =
        Boolean(deleteReferralError) ||
        (
          Array.isArray(
            deleteReferralData
          ) &&
          deleteReferralData.length === 0
        );


      add(
        19,
        "Browser referral DELETE boundary",
        referralDeleteBlocked
          ? "PASS"
          : "FAIL",

        deleteReferralError
          ? deleteReferralError.message
          : `affected_rows=${deleteReferralData?.length ?? 0}`
      );


      // ======================================================
      // 20 — FINAL AUTHENTICATED BOUNDARY
      // ======================================================

      const previousFailures =
        results.filter(
          row => row.result === "FAIL"
        ).length;

      const previousInfo =
        results.filter(
          row => row.result === "INFO"
        ).length;


      add(
        20,
        "Authenticated REF-6B boundary completed",

        previousFailures === 0 &&
        previousInfo === 0
          ? "PASS"
          : "FAIL",

        previousFailures === 0 &&
        previousInfo === 0
          ? "Authenticated boundary completed cleanly. No genuine case/referral records changed."
          : `Outstanding before final check: FAIL=${previousFailures}, INFO=${previousInfo}`
      );


      render();

    }


    // ========================================================
    // BUTTON
    // ========================================================

    document
      .getElementById("runBtn")
      .addEventListener(
        "click",
        async () => {

          const button =
            document.getElementById(
              "runBtn"
            );


          button.disabled = true;

          button.textContent =
            "Running REF-6B...";


          try {

            await runTests();

          } catch (error) {

            add(
              999,
              "Unexpected test harness error",
              "FAIL",
              `${error.name}: ${error.message}`
            );

            render();

          } finally {

            button.disabled = false;

            button.textContent =
              "Run REF-6B";

          }

        }
      );

  </script>

</body>
</html>
