<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VB REF-6B Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
      margin: 15px 0 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #444;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    #summary {
      margin-top: 20px;
      padding: 15px;
      background: #1c1c1c;
      font-weight: bold;
    }

    .PASS { font-weight: bold; }
    .FAIL { font-weight: bold; }
    .INFO { font-weight: bold; }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
  </style>
</head>

<body>

  <h1>REF-6B — Authenticated Browser Assault</h1>

  <p>DEV only. Read-only authenticated boundary test.</p>

  <button id="runBtn" disabled>Loading test harness...</button>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Test</th>
        <th>Result</th>
        <th>Evidence</th>
      </tr>
    </thead>

    <tbody id="results"></tbody>
  </table>

  <div id="summary">Initialising...</div>


  <script type="module">

    const results = [];

    const EXPECTED_AUTH_UID =
      "4f72cbe3-8b73-45c7-a2d7-2d5484bdfb5e";

    const EXPECTED_STAFF_ID =
      "692a00f9-5944-46b0-9efe-e4eccabc21e2";

    const EXPECTED_SITE_ID =
      "b7129ac5-924c-46fb-9e84-79274064f318";


    function add(number, test, result, evidence = "") {
      results.push({
        number,
        test,
        result,
        evidence
      });
    }


    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function render() {

      const tbody =
        document.getElementById("results");

      tbody.innerHTML = results.map(row => `
        <tr>
          <td>${row.number}</td>
          <td>${esc(row.test)}</td>
          <td class="${esc(row.result)}">
            ${esc(row.result)}
          </td>
          <td>
            <pre>${esc(row.evidence)}</pre>
          </td>
        </tr>
      `).join("");


      const pass =
        results.filter(r => r.result === "PASS").length;

      const fail =
        results.filter(r => r.result === "FAIL").length;

      const info =
        results.filter(r => r.result === "INFO").length;


      document.getElementById("summary").textContent =
        `PASS=${pass} | FAIL=${fail} | INFO=${info} | TOTAL=${results.length}`;
    }


    let supabase;


    /*
     * IMPORT THE ACTUAL VB SHARED CLIENT.
     *
     * Dynamic import lets us catch a loading failure and
     * display it on screen rather than leaving a dead button.
     */
    try {

      const module =
        await import("./js/supabase-client.js");

      supabase = module.supabase;

      if (!supabase) {
        throw new Error(
          "Module loaded but did not export supabase."
        );
      }


      document.getElementById("runBtn").disabled = false;

      document.getElementById("runBtn").textContent =
        "Run REF-6B";

      document.getElementById("summary").textContent =
        "Harness loaded. Ready to test.";


    } catch (error) {

      add(
        0,
        "Load shared Supabase client",
        "FAIL",
        error.message
      );

      render();
    }


    async function runTests() {

      results.length = 0;

      add(
        1,
        "Shared Supabase client loaded",
        "PASS",
        "Imported from ./js/supabase-client.js"
      );


      // ======================================================
      // AUTH SESSION
      // ======================================================

      const {
        data: sessionData,
        error: sessionError
      } = await supabase.auth.getSession();


      if (sessionError) {

        add(
          2,
          "Authenticated session available",
          "FAIL",
          sessionError.message
        );

        render();
        return;
      }


      const session = sessionData?.session;
      const user = session?.user;


      add(
        2,
        "Authenticated session available",
        session ? "PASS" : "FAIL",
        session
          ? `Authenticated as ${user.email}`
          : "No active session"
      );


      if (!session) {
        render();
        return;
      }


      add(
        3,
        "Correct DEV authentication identity",
        user.id === EXPECTED_AUTH_UID
          ? "PASS"
          : "FAIL",
        `auth.uid=${user.id}`
      );


      // ======================================================
      // RESOLVE STAFF THROUGH DATABASE FUNCTION
      //
      // We already know current_staff_id() is the canonical
      // authenticated identity resolver used by VB.
      // ======================================================

      const {
        data: currentStaffId,
        error: currentStaffError
      } = await supabase.rpc("current_staff_id");


      add(
        4,
        "Authenticated identity resolves to VB staff",
        !currentStaffError &&
        currentStaffId === EXPECTED_STAFF_ID
          ? "PASS"
          : "FAIL",
        currentStaffError
          ? currentStaffError.message
          : `staff_id=${currentStaffId}`
      );


      // ======================================================
      // STAFF RECORD
      // ======================================================

      const {
        data: staffRows,
        error: staffError
      } = await supabase
        .from("staff_profiles")
        .select("*")
        .eq("id", EXPECTED_STAFF_ID)
        .limit(1);


      const staff =
        !staffError && staffRows?.length
          ? staffRows[0]
          : null;


      add(
        5,
        "Staff record visible through RLS",
        staffError
          ? "FAIL"
          : staff
            ? "PASS"
            : "FAIL",
        staffError
          ? staffError.message
          : staff
            ? `${staff.display_name} / ${staff.staff_code}`
            : "Expected staff record not visible"
      );


      if (staff) {

        add(
       add(
  6,
  "Staff identity active",
  staff.is_active === true
    ? "PASS"
    : "FAIL",
  `is_active=${staff.is_active}`
);


        add(
          7,
          "Expected site scope",
          staff.site_id === EXPECTED_SITE_ID
            ? "PASS"
            : "FAIL",
          `site_id=${staff.site_id}`
        );

      } else {

        add(
          6,
          "Staff identity active",
          "INFO",
          "Skipped because staff record unavailable"
        );

        add(
          7,
          "Expected site scope",
          "INFO",
          "Skipped because staff record unavailable"
        );
      }


      // ======================================================
      // CASE READ
      // ======================================================

      const {
        data: cases,
        error: caseError
      } = await supabase
        .from("cases")
        .select(
          "id,case_code,case_status,veteran_id,site_id,assigned_staff_id"
        )
        .limit(20);


      add(
        8,
        "Permitted cases readable",
        caseError ? "FAIL" : "PASS",
        caseError
          ? caseError.message
          : `visible_rows=${cases.length}`
      );


      if (!caseError) {

        const outside =
          cases.filter(
            row =>
              row.site_id &&
              row.site_id !== EXPECTED_SITE_ID
          );


        add(
          9,
          "Visible cases remain within expected site",
          outside.length === 0
            ? "PASS"
            : "FAIL",
          `out_of_scope_rows=${outside.length}`
        );

      } else {

        add(
          9,
          "Visible cases remain within expected site",
          "INFO",
          "Case query failed"
        );
      }


      // ======================================================
      // REFERRAL READ
      // ======================================================

      const {
        data: referrals,
        error: referralError
      } = await supabase
        .from("referrals")
        .select("*")
        .limit(20);


      add(
        10,
        "Permitted referrals readable",
        referralError ? "FAIL" : "PASS",
        referralError
          ? referralError.message
          : `visible_rows=${referrals.length}`
      );


      if (!referralError) {

        const outside =
          referrals.filter(
            row =>
              row.site_id &&
              row.site_id !== EXPECTED_SITE_ID
          );


        add(
          11,
          "Visible referrals remain within expected site",
          outside.length === 0
            ? "PASS"
            : "FAIL",
          `out_of_scope_rows=${outside.length}`
        );

      } else {

        add(
          11,
          "Visible referrals remain within expected site",
          "INFO",
          "Referral query failed"
        );
      }


      // ======================================================
      // CASE OPERATIONAL EXCEPTIONS
      // ======================================================

      const {
        data: exceptions,
        error: exceptionError
      } = await supabase
        .from("case_operational_exceptions")
        .select("*")
        .limit(20);


      add(
        12,
        "Case exception view respects authenticated access",
        exceptionError ? "FAIL" : "PASS",
        exceptionError
          ? exceptionError.message
          : `visible_rows=${exceptions.length}`
      );


      // ======================================================
      // INTERNAL EVALUATOR MUST NOT BE CALLABLE
      // ======================================================

      const {
        error: evaluatorError
      } = await supabase.rpc(
        "evaluate_case_controls"
      );


      add(
        13,
        "Internal case evaluator blocked from browser",
        evaluatorError ? "PASS" : "FAIL",
        evaluatorError
          ? evaluatorError.message
          : "Evaluator unexpectedly executed"
      );


      // ======================================================
      // CASE TIMELINE
      // ======================================================

      const {
        data: events,
        error: eventsError
      } = await supabase
        .from("case_events")
        .select("*")
        .limit(20);


      add(
        14,
        "Permitted case timeline readable",
        eventsError ? "FAIL" : "PASS",
        eventsError
          ? eventsError.message
          : `visible_rows=${events.length}`
      );


      // ======================================================
      // CASE ACTIONS
      // ======================================================

      const {
        data: actions,
        error: actionsError
      } = await supabase
        .from("case_actions")
        .select("*")
        .limit(20);


      add(
        15,
        "Permitted case actions readable",
        actionsError ? "FAIL" : "PASS",
        actionsError
          ? actionsError.message
          : `visible_rows=${actions.length}`
      );


      // ======================================================
      // CASE REVIEWS
      // ======================================================

      const {
        data: reviews,
        error: reviewsError
      } = await supabase
        .from("case_reviews")
        .select("*")
        .limit(20);


      add(
        16,
        "Permitted case reviews readable",
        reviewsError ? "FAIL" : "PASS",
        reviewsError
          ? reviewsError.message
          : `visible_rows=${reviews.length}`
      );


      // ======================================================
      // REFERRAL FOLLOW-UPS
      // ======================================================

      const {
        data: followUps,
        error: followUpError
      } = await supabase
        .from("referral_follow_ups")
        .select("*")
        .limit(20);


      add(
        17,
        "Permitted referral follow-ups readable",
        followUpError ? "FAIL" : "PASS",
        followUpError
          ? followUpError.message
          : `visible_rows=${followUps.length}`
      );


      // ======================================================
      // DELETE AUTHORITY
      //
      // REF-6A already proved authenticated has NO DELETE
      // grants. Here we report browser behaviour as INFO,
      // because PostgREST may represent an RLS-denied DELETE
      // as zero affected rows rather than an HTTP error.
      // ======================================================

      const fakeCaseId =
        "00000000-0000-0000-0000-000000000001";


      const {
        data: deleteCaseData,
        error: deleteCaseError
      } = await supabase
        .from("cases")
        .delete()
        .eq("id", fakeCaseId)
        .select("id");


      add(
        18,
        "Browser case DELETE boundary",
        deleteCaseError
          ? "PASS"
          : (
              Array.isArray(deleteCaseData) &&
              deleteCaseData.length === 0
                ? "PASS"
                : "FAIL"
            ),
        deleteCaseError
          ? deleteCaseError.message
          : `affected_rows=${deleteCaseData?.length ?? 0}`
      );


      const fakeReferralId =
        "00000000-0000-0000-0000-000000000002";


      const {
        data: deleteReferralData,
        error: deleteReferralError
      } = await supabase
        .from("referrals")
        .delete()
        .eq("id", fakeReferralId)
        .select("id");


      add(
        19,
        "Browser referral DELETE boundary",
        deleteReferralError
          ? "PASS"
          : (
              Array.isArray(deleteReferralData) &&
              deleteReferralData.length === 0
                ? "PASS"
                : "FAIL"
            ),
        deleteReferralError
          ? deleteReferralError.message
          : `affected_rows=${deleteReferralData?.length ?? 0}`
      );


      // ======================================================
      // FINAL AUTH CONTEXT
      // ======================================================

      add(
        20,
        "Authenticated REF-6B boundary completed",
        results.some(r => r.result === "FAIL")
          ? "FAIL"
          : "PASS",
        "No test writes to genuine case/referral records."
      );


      render();
    }


    document
      .getElementById("runBtn")
      .addEventListener("click", async () => {

        const button =
          document.getElementById("runBtn");

        button.disabled = true;
        button.textContent = "Running...";

        try {

          await runTests();

        } catch (error) {

          add(
            999,
            "Unexpected harness error",
            "FAIL",
            `${error.name}: ${error.message}`
          );

          render();

        } finally {

          button.disabled = false;
          button.textContent = "Run REF-6B";
        }

      });

  </script>

</body>
</html>
