<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VB Core — SELF-D2 Authenticated Test</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: #f5f5f5;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .sub {
      color: #b8c0cc;
      margin-bottom: 25px;
    }

    .panel {
      background: #191e28;
      border: 1px solid #303846;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .run {
      background: #fff;
      color: #111;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    .pass {
      color: #66e38f;
    }

    .fail {
      color: #ff6b6b;
    }

    .warn {
      color: #ffd166;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }

    th,
    td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #303846;
      vertical-align: top;
    }

    th {
      color: #cbd3df;
    }

    .summary {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }

    code {
      word-break: break-all;
    }

    .small {
      color: #aeb7c4;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>SELF-D2 Authenticated Assault Test</h1>

  <div class="sub">
    Veterans Backbone Core — DEV only.
    Tests the self-referral machinery through the real authenticated
    Supabase browser session.
  </div>


  <div class="panel">

    <strong>Current session</strong>

    <div id="sessionStatus" class="status">
      Checking...
    </div>

    <div id="identity" class="small"></div>

  </div>


  <div class="panel">

    <button
      id="runButton"
      class="run"
      disabled
    >
      Run SELF-D2
    </button>

    <div id="runStatus" class="status"></div>

  </div>


  <div class="panel">

    <strong>Results</strong>

    <div id="summary" class="summary">
      Not run
    </div>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Area</th>
          <th>Test</th>
          <th>Result</th>
          <th>Detail</th>
        </tr>
      </thead>

      <tbody id="resultsBody"></tbody>

    </table>

  </div>

</div>


<script type="module">

import { supabase }
from "./js/supabase-client.js";


const runButton =
  document.getElementById("runButton");

const sessionStatus =
  document.getElementById("sessionStatus");

const identity =
  document.getElementById("identity");

const runStatus =
  document.getElementById("runStatus");

const resultsBody =
  document.getElementById("resultsBody");

const summary =
  document.getElementById("summary");


const EXPECTED_AUTH_USER =
  "4f72cbe3-8b73-45c7-a2d7-2d5484bdfb5e";

const EXPECTED_STAFF =
  "692a00f9-5944-46b0-9efe-e4eccabc21e2";

const EXPECTED_ORG =
  "71c87b5e-f84f-4e9b-b167-d48745fc838c";

const EXPECTED_SITE =
  "b7129ac5-924c-46fb-9e84-79274064f318";

const EXPECTED_TEAM =
  "b3832f55-91c9-47fe-a021-e59c6401052d";


let currentUser = null;
let currentStaff = null;

let testVeteranId = null;
let testRequestId = null;
let createdCaseId = null;
let createdReferralId = null;


const results = [];


/* ============================================================
   RESULT HELPERS
============================================================ */

function addResult(
  number,
  area,
  name,
  passed,
  detail = ""
) {

  results.push({
    number,
    area,
    name,
    passed,
    detail
  });


  const tr =
    document.createElement("tr");


  tr.innerHTML = `
    <td>${number}</td>
    <td>${escapeHtml(area)}</td>
    <td>${escapeHtml(name)}</td>
    <td class="${passed ? "pass" : "fail"}">
      ${passed ? "PASS" : "FAIL"}
    </td>
    <td>
      <code>${escapeHtml(detail || "")}</code>
    </td>
  `;


  resultsBody.appendChild(tr);

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function errorText(error) {

  if (!error) {
    return "";
  }

  return [
    error.message,
    error.details,
    error.hint,
    error.code
  ]
    .filter(Boolean)
    .join(" | ");

}


function updateSummary() {

  const pass =
    results.filter(x => x.passed).length;

  const fail =
    results.filter(x => !x.passed).length;

  const total =
    results.length;


  summary.textContent =
    `SELF-D2 — PASS=${pass} | FAIL=${fail} | TOTAL=${total}`;


  summary.className =
    "summary " +
    (fail === 0 ? "pass" : "fail");

}


/* ============================================================
   SESSION CHECK
============================================================ */

async function checkSession() {

  const {
    data: {
      session
    },
    error
  } =
    await supabase.auth.getSession();


  if (error || !session?.user) {

    sessionStatus.textContent =
      "FAIL — no authenticated Supabase session.";

    sessionStatus.className =
      "status fail";

    identity.textContent =
      errorText(error);

    return;

  }


  currentUser =
    session.user;


  sessionStatus.textContent =
    "Authenticated session found.";

  sessionStatus.className =
    "status pass";


  identity.textContent =
    `auth.uid() = ${currentUser.id}`;


  runButton.disabled = false;

}


await checkSession();



/* ============================================================
   TEST RUNNER
============================================================ */

runButton.addEventListener(
  "click",
  async () => {

    runButton.disabled = true;

    results.length = 0;

    resultsBody.innerHTML = "";

    summary.textContent =
      "Running...";

    summary.className =
      "summary warn";

    runStatus.textContent =
      "Steve has entered the torture chamber...";

    runStatus.className =
      "status warn";


    try {

      await runTests();

    }
    catch (err) {

      console.error(err);

      runStatus.textContent =
        "Unexpected harness error: " +
        (err?.message || err);

      runStatus.className =
        "status fail";

    }


    updateSummary();

    runButton.disabled = false;

  }
);



async function runTests() {


/* ============================================================
   1 — AUTH USER EXISTS
============================================================ */

addResult(
  1,
  "AUTH",
  "Authenticated user exists",
  !!currentUser?.id,
  currentUser?.id
);


/* ============================================================
   2 — EXPECTED DEV AUTH USER
============================================================ */

addResult(
  2,
  "AUTH",
  "Correct DEV authentication identity",
  currentUser?.id === EXPECTED_AUTH_USER,
  currentUser?.id
);


/* ============================================================
   GET STAFF PROFILE
============================================================ */

const {
  data: staffRows,
  error: staffError
} =
  await supabase
    .from("staff_profiles")
    .select(`
      id,
      auth_user_id,
      organisation_id,
      primary_site_id,
      primary_team_id,
      staff_code,
      display_name,
      is_active
    `)
    .eq(
      "auth_user_id",
      currentUser.id
    );


currentStaff =
  staffRows?.[0] || null;


/* ============================================================
   3 — STAFF PROFILE VISIBLE
============================================================ */

addResult(
  3,
  "IDENTITY",
  "Authenticated identity resolves to staff profile",
  !staffError &&
  staffRows?.length === 1,
  staffError
    ? errorText(staffError)
    : `rows=${staffRows?.length ?? 0}`
);


/* ============================================================
   4 — EXPECTED STAFF ID
============================================================ */

addResult(
  4,
  "IDENTITY",
  "Correct permanent staff identity",
  currentStaff?.id === EXPECTED_STAFF,
  currentStaff?.id
);


/* ============================================================
   5 — STAFF ACTIVE
============================================================ */

addResult(
  5,
  "IDENTITY",
  "DEV staff identity is active",
  currentStaff?.is_active === true,
  `is_active=${currentStaff?.is_active}`
);


/* ============================================================
   6 — ORGANISATION SCOPE
============================================================ */

addResult(
  6,
  "SCOPE",
  "Correct organisation scope",
  currentStaff?.organisation_id === EXPECTED_ORG,
  currentStaff?.organisation_id
);


/* ============================================================
   7 — SITE SCOPE
============================================================ */

addResult(
  7,
  "SCOPE",
  "Correct primary site scope",
  currentStaff?.primary_site_id === EXPECTED_SITE,
  currentStaff?.primary_site_id
);


/* ============================================================
   8 — TEAM SCOPE
============================================================ */

addResult(
  8,
  "SCOPE",
  "Correct primary team scope",
  currentStaff?.primary_team_id === EXPECTED_TEAM,
  currentStaff?.primary_team_id
);


/* ============================================================
   9 — SELF-REFERRAL REQUESTS ARE READABLE
============================================================ */

const {
  error: requestReadError
} =
  await supabase
    .from("self_referral_requests")
    .select("id")
    .limit(1);


addResult(
  9,
  "RLS",
  "Authorised staff can query self-referral requests",
  !requestReadError,
  errorText(requestReadError)
);


/* ============================================================
   10 — SELF-REFERRAL NEEDS ARE READABLE
============================================================ */

const {
  error: needReadError
} =
  await supabase
    .from("self_referral_needs")
    .select("id")
    .limit(1);


addResult(
  10,
  "RLS",
  "Authorised staff can query self-referral needs",
  !needReadError,
  errorText(needReadError)
);


/* ============================================================
   11 — SELF-REFERRAL EVENTS ARE READABLE
============================================================ */

const {
  error: eventReadError
} =
  await supabase
    .from("self_referral_events")
    .select("id")
    .limit(1);


addResult(
  11,
  "RLS",
  "Authorised staff can query self-referral events",
  !eventReadError,
  errorText(eventReadError)
);


/* ============================================================
   12 — IDENTITY VAULT MUST NOT BE READABLE
============================================================ */

const {
  error: vaultError
} =
  await supabase
    .from("veteran_identity_vault")
    .select("veteran_id")
    .limit(1);


addResult(
  12,
  "PRIVACY",
  "Authenticated browser cannot directly read identity vault",
  !!vaultError,
  vaultError
    ? errorText(vaultError)
    : "Vault unexpectedly readable"
);


/* ============================================================
   13 — DIRECT DELETE MUST FAIL
============================================================ */

const {
  error: deleteError
} =
  await supabase
    .from("self_referral_requests")
    .delete()
    .eq(
      "id",
      "00000000-0000-0000-0000-000000000001"
    );


addResult(
  13,
  "SECURITY",
  "Authenticated browser cannot DELETE self-referrals",
  !!deleteError,
  deleteError
    ? errorText(deleteError)
    : "DELETE unexpectedly accepted"
);


/* ============================================================
   14 — CONTROLLED CASE-CHECK RPC IS REACHABLE

   Deliberately uses a non-existent request UUID.
   We want the function to execute and reject the object,
   rather than PostgREST saying the function is unavailable.
============================================================ */

const {
  error: caseCheckReachError
} =
  await supabase.rpc(
    "record_self_referral_case_check",
    {
      p_self_referral_request_id:
        "00000000-0000-0000-0000-000000000001",

      p_outcome:
        "no_active_case",

      p_existing_case_id:
        null
    }
  );


const caseCheckMessage =
  errorText(caseCheckReachError);


const caseCheckReachable =
  !!caseCheckReachError &&
  !caseCheckMessage.toLowerCase()
    .includes("could not find the function") &&
  !caseCheckMessage.toLowerCase()
    .includes("permission denied for function");


addResult(
  14,
  "CONTROLLED BRIDGE",
  "Controlled case-check RPC is reachable by authenticated staff",
  caseCheckReachable,
  caseCheckMessage
);


/* ============================================================
   15 — CASE CREATION RPC IS REACHABLE
============================================================ */

const {
  error: caseCreateReachError
} =
  await supabase.rpc(
    "create_case_from_self_referral",
    {
      p_self_referral_request_id:
        "00000000-0000-0000-0000-000000000001",

      p_team_id:
        EXPECTED_TEAM,

      p_assigned_staff_id:
        EXPECTED_STAFF
    }
  );


const caseCreateMessage =
  errorText(caseCreateReachError);


const caseCreateReachable =
  !!caseCreateReachError &&
  !caseCreateMessage.toLowerCase()
    .includes("could not find the function") &&
  !caseCreateMessage.toLowerCase()
    .includes("permission denied for function");


addResult(
  15,
  "CONTROLLED BRIDGE",
  "Controlled case-creation RPC is reachable by authenticated staff",
  caseCreateReachable,
  caseCreateMessage
);


/* ============================================================
   16 — CONVERSION RPC IS REACHABLE
============================================================ */

const {
  error: conversionReachError
} =
  await supabase.rpc(
    "convert_self_referral_to_referral",
    {
      p_self_referral_request_id:
        "00000000-0000-0000-0000-000000000001",

      p_destination_name:
        "SELF-D2 FICTIONAL SERVICE",

      p_referral_purpose:
        "DEV authenticated bridge test",

      p_review_at:
        new Date(
          Date.now() +
          (7 * 24 * 60 * 60 * 1000)
        ).toISOString()
    }
  );


const conversionMessage =
  errorText(conversionReachError);


const conversionReachable =
  !!conversionReachError &&
  !conversionMessage.toLowerCase()
    .includes("could not find the function") &&
  !conversionMessage.toLowerCase()
    .includes("permission denied for function");


addResult(
  16,
  "CONTROLLED BRIDGE",
  "Controlled referral-conversion RPC is reachable by authenticated staff",
  conversionReachable,
  conversionMessage
);


/* ============================================================
   17 — EXCEPTION VIEW READ
============================================================ */

const {
  error: exceptionError
} =
  await supabase
    .from(
      "self_referral_operational_exceptions"
    )
    .select("*")
    .limit(1);


addResult(
  17,
  "EXCEPTIONS",
  "Operational exception view is queryable under authenticated RLS",
  !exceptionError,
  errorText(exceptionError)
);


/* ============================================================
   18 — DIRECT REQUEST INSERT MUST NOT BE AVAILABLE TO STAFF

   Staff triage existing portal submissions.
   They do not impersonate the veteran-facing intake route.
============================================================ */

const {
  error: directInsertError
} =
  await supabase
    .from("self_referral_requests")
    .insert({
      organisation_id: EXPECTED_ORG,
      site_id: EXPECTED_SITE,
      submission_source: "veteran_portal",
      supplied_first_name: "Steve",
      supplied_last_name: "ShouldNotExist",
      supplied_email_address:
        "steve.should-not-exist@invalid.example",
      support_request_summary:
        "SELF-D2 direct insert rejection test",
      needs_summary:
        "This row must not be created.",
      consent_to_contact: true,
      consent_to_process: true,
      preferred_contact_method: "email",
      intake_status: "submitted"
    });


addResult(
  18,
  "BOUNDARY",
  "Authenticated staff cannot directly create veteran self-referrals",
  !!directInsertError,
  directInsertError
    ? errorText(directInsertError)
    : "INSERT unexpectedly accepted"
);


/* ============================================================
   19 — NO DIRECT NEED INSERT FOR STAFF
============================================================ */

const {
  error: directNeedInsertError
} =
  await supabase
    .from("self_referral_needs")
    .insert({
      self_referral_request_id:
        "00000000-0000-0000-0000-000000000001",

      need_code:
        "SELF_D2",

      need_label:
        "Should not exist",

      veteran_notes:
        "Direct authenticated insert test"
    });


addResult(
  19,
  "BOUNDARY",
  "Authenticated staff cannot directly manufacture portal needs",
  !!directNeedInsertError,
  directNeedInsertError
    ? errorText(directNeedInsertError)
    : "INSERT unexpectedly accepted"
);


/* ============================================================
   20 — NO DIRECT EVENT INSERT FOR STAFF
============================================================ */

const {
  error: directEventInsertError
} =
  await supabase
    .from("self_referral_events")
    .insert({
      self_referral_request_id:
        "00000000-0000-0000-0000-000000000001",

      event_type:
        "SELF_D2_FAKE",

      event_summary:
        "This event must not be directly insertable."
    });


addResult(
  20,
  "AUDIT",
  "Authenticated staff cannot directly manufacture self-referral events",
  !!directEventInsertError,
  directEventInsertError
    ? errorText(directEventInsertError)
    : "INSERT unexpectedly accepted"
);


/* ============================================================
   FINISH
============================================================ */

const pass =
  results.filter(x => x.passed).length;

const fail =
  results.filter(x => !x.passed).length;


if (fail === 0 && results.length === 20) {

  runStatus.textContent =
    "SELF-D2 complete — all 20 authenticated tests passed.";

  runStatus.className =
    "status pass";

}
else {

  runStatus.textContent =
    `SELF-D2 finished with ${fail} failure(s). ` +
    `Do not delete this page yet.`;

  runStatus.className =
    "status fail";

}

}

</script>

</body>
</html>
